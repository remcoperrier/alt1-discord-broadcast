<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Koek</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
        background: #1b1b1f;
        color: #d7d7db;
      }
      .wrap { padding: 10px 12px 14px; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .sub { color: #83838c; font-size: 11px; margin-bottom: 8px; }
      label { display: block; margin: 9px 0 2px; color: #9a9aa2; font-size: 12px; }
      input[type="text"], input[type="url"] {
        width: 100%;
        padding: 5px 7px;
        background: #26262b;
        border: 1px solid #3a3a42;
        border-radius: 4px;
        color: #eee;
        font: inherit;
      }
      input:focus { outline: 1px solid #5b5bf0; border-color: #5b5bf0; }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .row label { margin: 0; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px 10px;
        margin-top: 4px;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        color: #d7d7db;
        font-size: 12px;
      }
      input[type="number"] {
        padding: 4px 6px;
        background: #26262b;
        border: 1px solid #3a3a42;
        border-radius: 4px;
        color: #eee;
        font: inherit;
      }
      .btns { display: flex; gap: 8px; margin-top: 12px; }
      button {
        padding: 6px 12px;
        border: 0;
        border-radius: 4px;
        color: #fff;
        font: inherit;
        cursor: pointer;
        background: #3b3bd6;
      }
      button.secondary { background: #34343c; }
      button:hover { filter: brightness(1.1); }
      #status {
        margin-top: 12px;
        padding: 6px 9px;
        border-radius: 4px;
        background: #26262b;
        font-size: 12px;
      }
      #status.ok { background: #14351f; color: #7ee2a8; }
      #status.warn { background: #3a3216; color: #f5cf7a; }
      #status.err { background: #3a1a1a; color: #f2a3a3; }
      #log {
        margin-top: 9px;
        height: 132px;
        overflow: auto;
        background: #141417;
        border: 1px solid #2c2c33;
        border-radius: 4px;
        padding: 6px 8px;
        font: 11px/1.5 ui-monospace, "Cascadia Code", monospace;
        white-space: pre-wrap;
      }
      #log .ok { color: #6fe0a0; }
      #log .warn { color: #f0cd83; }
      #log .err { color: #f09b9b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Discord Koek</h1>
      <div class="sub">Posts your RS3 drops to a Discord channel.</div>

      <label for="rsn">Your RuneScape name <span style="color:#83838c">(auto-detected — leave blank)</span></label>
      <input id="rsn" type="text" placeholder="detected from your chat box…" autocomplete="off" spellcheck="false" />

      <label for="webhook">Discord webhook URL</label>
      <input id="webhook" type="url" placeholder="https://discord.com/api/webhooks/..." autocomplete="off" spellcheck="false" />

      <label>Broadcast</label>
      <div class="grid">
        <label class="chk"><input id="c-drops" type="checkbox" /> Drops &amp; pets</label>
        <label class="chk"><input id="c-levelups" type="checkbox" /> Level-ups</label>
        <label class="chk"><input id="c-milestones" type="checkbox" /> 99 / 120 / XP</label>
        <label class="chk"><input id="c-titles" type="checkbox" /> Titles</label>
        <label class="chk"><input id="c-areatasks" type="checkbox" /> Area tasks</label>
        <label class="chk"><input id="c-clues" type="checkbox" /> Clue caskets</label>
      </div>

      <div class="row">
        <label for="lvlmin" style="margin:0">Level-ups only from level</label>
        <input id="lvlmin" type="number" min="2" max="120" style="width:64px" />
      </div>

      <div class="row">
        <input id="shot" type="checkbox" />
        <label for="shot">Attach a screenshot to drop / clue posts</label>
      </div>

      <div class="row">
        <input id="debug" type="checkbox" />
        <label for="debug">Log every chat line (debug)</label>
      </div>

      <div class="btns">
        <button id="save">Save</button>
        <button id="test" class="secondary">Send test</button>
      </div>

      <div id="status">Starting&hellip;</div>
      <div id="log"></div>
    </div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
